# Makes renderer/bedrock-blocks.json (Java -> Bedrock block names, for the app's "Save for Bedrock").
# Runs when branch "bedrockmap" is pushed; the file goes to branch "bedrockmap-results".
name: Bedrock block table

on:
  push:
    branches: [bedrockmap]

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - name: Java block list from Minecraft's own report
        run: |
          url=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | python3 -c "import json,sys,urllib.request; m=json.load(sys.stdin); v=[x for x in m['versions'] if x['id']=='26.3'][0]; print(json.load(urllib.request.urlopen(v['url']))['downloads']['server']['url'])")
          mkdir -p gen && cd gen && curl -sL "$url" -o server.jar
          java -DbundlerMainClass=net.minecraft.data.Main -jar server.jar --reports --output out > gen.log 2>&1 || tail -20 gen.log
          ls -la out/reports
      - name: Join with GeyserMC's Bedrock table
        run: |
          git clone -q --depth 1 https://github.com/GeyserMC/mappings geyser
          pip install -q nbtlib
          mkdir -p res && python3 tools/bedrock/make_map.py gen/out/reports/blocks.json geyser/blocks.nbt res/bedrock-blocks.json | tee res/log.txt
          python3 -c "import nbtlib; print('geyser states', len(nbtlib.load('geyser/blocks.nbt')['bedrock_mappings']))" | tee -a res/log.txt
          (cd geyser && git log -1 --format='geyser %H %ci' && head -5 README.md) >> res/log.txt
          ls -la res
      - name: Save
        run: |
          cd res && echo "${GITHUB_SHA}" > COMMIT
          git init -q -b bedrockmap-results && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "bedrock map ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" bedrockmap-results
