          - { mc: "26.1.1", id: forge-26.1.1, loader: forge, kind: forge26, dir: ports/forge-26, run: 25, target: 25, type: beta, gv: "26.1.1" }
          - { mc: "26.1", id: neoforge-26.1, loader: neoforge, kind: neo26, dir: ports/neoforge-26, run: 25, target: 25, type: beta, gv: "26.1" }
          - { mc: "26.1", id: forge-26.1, loader: forge, kind: forge26, dir: ports/forge-26, run: 25, target: 25, type: beta, gv: "26.1" }
          - { mc: "1.21.9", id: forge-1.21.9, loader: forge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.9" }
          - { mc: "1.21.7", id: forge-1.21.7, loader: forge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.7" }
          - { mc: "1.21.6", id: forge-1.21.6, loader: forge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.6" }
          - { mc: "1.21", id: forge-1.21, loader: forge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21" }
          - { mc: "1.20", id: forge-1.20, loader: forge, dir: ports/forge, run: 21, target: 17, type: beta, gv: "1.20" }
          - { mc: "1.19.1", id: forge-1.19.1, loader: forge, dir: ports/forge, run: 21, target: 17, type: beta, gv: "1.19.1" }
          - { mc: "1.18", id: forge-1.18, loader: forge, dir: ports/forge, run: 21, target: 17, type: beta, gv: "1.18" }
          - { mc: "1.21.9", id: neoforge-1.21.9, loader: neoforge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.9" }
          - { mc: "1.21.7", id: neoforge-1.21.7, loader: neoforge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.7" }
          - { mc: "1.21.6", id: neoforge-1.21.6, loader: neoforge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.6" }
          - { mc: "1.21.2", id: neoforge-1.21.2, loader: neoforge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.2" }
          - { mc: "1.21", id: neoforge-1.21, loader: neoforge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21" }
    name: mod ${{ matrix.id || matrix.mc }}
    steps:
      - uses: actions/checkout@v4
        if: needs.check.outputs.only == '' || contains(needs.check.outputs.only, format(' {0} ', matrix.id || matrix.mc))
      - uses: actions/setup-java@v4
        if: needs.check.outputs.only == '' || contains(needs.check.outputs.only, format(' {0} ', matrix.id || matrix.mc))
        with:
          distribution: temurin
          java-version: ${{ matrix.run }}
      - name: Find the Fabric API for this version
        if: needs.check.outputs.only == '' || contains(needs.check.outputs.only, format(' {0} ', matrix.id || matrix.mc))
        id: fapi
        run: |
          if [ "${{ matrix.mc }}" = "26.3" ] && [ -z "${{ matrix.loader }}" ]; then echo "args=" >> "$GITHUB_OUTPUT"; exit 0; fi   # 26.3 uses the version in gradle.properties
          if [ "${{ matrix.kind }}" = "neo26" ]; then
            P="${{ matrix.mc }}"; case "$P" in *.*.*) ;; *) P="$P.0" ;; esac
            F=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE "<version>$P\.[0-9]+(-beta)?</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1)
            echo "args=-Pminecraft_version=${{ matrix.mc }} -Pneo_version=$F" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ matrix.kind }}" = "forge26" ]; then
            for i in 1 2 3 4 5; do F=$(curl -s --retry 3 https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -o "<version>${{ matrix.mc }}-[^<]*</version>" | sed 's/<[^>]*>//g; s/^${{ matrix.mc }}-//' | tail -1); [ -n "$F" ] && break; sleep 10; done
            echo "args=-Pminecraft_version=${{ matrix.mc }} -Pforge_version=$F" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LOOM=$(curl -s https://maven.architectury.dev/dev/architectury/loom/dev.architectury.loom.gradle.plugin/maven-metadata.xml | grep -o "<latest>[^<]*</latest>" | sed 's/<[^>]*>//g')
          if [ "${{ matrix.loader }}" = "forge" ]; then
            F=$(curl -s https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -o "<version>${{ matrix.mc }}-[^<]*</version>" | sed 's/<[^>]*>//g; s/^${{ matrix.mc }}-//' | tail -1)
            echo "args=-Pminecraft_version=${{ matrix.mc }} -Pforge_version=$F -Parch_loom_version=$LOOM -Pjava_version=${{ matrix.target }} ${{ matrix.extra }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ matrix.loader }}" = "neoforge" ]; then
            P=$(echo "${{ matrix.mc }}" | sed 's/^1\.//'); case "$P" in *.*) ;; *) P="$P.0" ;; esac
            F=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE "<version>$P\.[0-9]+(-beta)?</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1)
            echo "args=-Ploom.platform=neoforge -Pminecraft_version=${{ matrix.mc }} -Pforge_version=$F -Parch_loom_version=$LOOM -Pjava_version=${{ matrix.target }} ${{ matrix.extra }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          V=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oE "<version>[^<]*\+(build\.[0-9]+-)?${{ matrix.fapi || matrix.mc }}</version>" | sed 's/<[^>]*>//g' | tail -1)
          if [ -z "$V" ]; then echo "::error title=mc ${{ matrix.mc }}::No Fabric API found"; exit 1; fi
          echo "args=-Pminecraft_version=${{ matrix.mc }} -Pfabric_api_version=$V -Pjava_version=${{ matrix.target }} ${{ matrix.extra }}" >> "$GITHUB_OUTPUT"
      - name: Build the mod
        if: needs.check.outputs.only == '' || contains(needs.check.outputs.only, format(' {0} ', matrix.id || matrix.mc))
        working-directory: ${{ matrix.dir }}
        run: |
          chmod +x gradlew
          rm -rf build/libs
          ./gradlew build -x test -Pmod_version="${{ needs.check.outputs.version }}" ${{ steps.fapi.outputs.args }} --no-daemon
          ls build/libs
      - name: Game versions for CurseForge
        if: needs.check.outputs.only == '' || contains(needs.check.outputs.only, format(' {0} ', matrix.id || matrix.mc))
        id: gv
        run: |
          {
            echo "list<<EOF"
            for v in ${{ matrix.gv }}; do echo "$v"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload to CurseForge
        if: needs.check.outputs.mronly == '' && (needs.check.outputs.only == '' || contains(needs.check.outputs.only, format(' {0} ', matrix.id || matrix.mc))) && contains(needs.check.outputs.cf, format(' {0} ', matrix.id || matrix.mc))
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1762212
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ matrix.dir }}/build/libs/buildblueprint-!(*-@(dev|sources|javadoc)).jar
          name: Build Blueprint ${{ needs.check.outputs.version }} for ${{ matrix.loader == 'forge' && 'Forge ' || matrix.loader == 'neoforge' && 'NeoForge ' || '' }}Minecraft ${{ matrix.mc }}${{ !contains(needs.check.outputs.ready, format(' {0} ', matrix.id || matrix.mc)) && matrix.type == 'beta' && ' (beta)' || '' }}
          version: ${{ needs.check.outputs.version }}+${{ matrix.id || matrix.mc }}
          version-type: ${{ contains(needs.check.outputs.ready, format(' {0} ', matrix.id || matrix.mc)) && 'release' || matrix.type }}
          loaders: ${{ matrix.loader || 'fabric' }}
          game-versions: ${{ steps.gv.outputs.list }}
          java: ${{ matrix.target }}
          dependencies: ${{ (matrix.loader || 'fabric') == 'fabric' && 'fabric-api(required)' || '' }}
          changelog-file: CHANGELOG.md

      - name: Upload to Modrinth
        if: always() && needs.check.outputs.mr != '' && (needs.check.outputs.only == '' || contains(needs.check.outputs.only, format(' {0} ', matrix.id || matrix.mc))) && (contains(needs.check.outputs.cf, format(' {0} ', matrix.id || matrix.mc)) || contains(needs.check.outputs.mronly, format(' {0} ', matrix.id || matrix.mc)))
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ needs.check.outputs.mr }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ matrix.dir }}/build/libs/buildblueprint-!(*-@(dev|sources|javadoc)).jar
          name: Build Blueprint ${{ needs.check.outputs.version }} for ${{ matrix.loader == 'forge' && 'Forge ' || matrix.loader == 'neoforge' && 'NeoForge ' || 'Fabric ' }}${{ matrix.mc }}
          version: ${{ needs.check.outputs.version }}+${{ matrix.id || matrix.mc }}
          version-type: ${{ contains(needs.check.outputs.ready, format(' {0} ', matrix.id || matrix.mc)) && 'release' || matrix.type }}
          loaders: ${{ matrix.loader || 'fabric' }}
          game-versions: ${{ steps.gv.outputs.list }}
          java: ${{ matrix.target }}
          dependencies: ${{ (matrix.loader || 'fabric') == 'fabric' && 'fabric-api(required)' || '' }}
          changelog-file: CHANGELOG.md
