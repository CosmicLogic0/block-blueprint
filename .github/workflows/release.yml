# Makes a new release when the version in package.json goes up (or when run by hand from the Actions tab):
#   1. builds the Windows installer for the app and puts it on the GitHub Releases page
#      (installed apps see it and update themselves)
#   2. builds the Minecraft mod, attaches the .jar to the same release and uploads it to CurseForge
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

  app:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build the installer
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish never 2>&1 | tee build.log
      - name: Show the build error
        if: failure()
        shell: bash
        run: |
          msg=$(tail -n 40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Installer build failed::$msg"
      - name: Put the installer on the release page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: Block Blueprint ${{ needs.check.outputs.version }}
          body_path: CHANGELOG.md
          make_latest: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  mod:
    runs-on: ubuntu-latest
    needs: [check, app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build the mod
        working-directory: fabric-mod
        run: |
          chmod +x gradlew
          ./gradlew build -x test -Pmod_version="${{ needs.check.outputs.version }}" --no-daemon
      - name: Attach the mod to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          files: fabric-mod/build/libs/buildblueprint-*.jar
          make_latest: true
      - name: Upload to CurseForge
        if: ${{ vars.CURSEFORGE_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric-mod/build/libs/buildblueprint-!(*-@(dev|sources|javadoc)).jar
          name: Build Blueprint ${{ needs.check.outputs.version }}
          version: ${{ needs.check.outputs.version }}
          version-type: release
          loaders: fabric
          game-versions: "26.3"
          java: 25
          dependencies: fabric-api(required)
          changelog-file: CHANGELOG.md
