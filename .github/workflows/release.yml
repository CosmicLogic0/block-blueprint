# Makes a new release when a version tag is pushed (for example v1.2.0):
#   1. builds the Windows installer for the app and puts it on the GitHub Releases page
#      (installed apps see it and update themselves)
#   2. builds the Minecraft mod, attaches the .jar to the same release and uploads it to CurseForge
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the tag as the app version
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then npm pkg set version="$V"; fi
      - run: npm ci
      - name: Build installer and publish it
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mod:
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build the mod
        working-directory: fabric-mod
        run: |
          chmod +x gradlew
          ./gradlew build -x test -Pmod_version="${GITHUB_REF_NAME#v}" --no-daemon
      - name: Attach the mod to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: fabric-mod/build/libs/buildblueprint-*.jar
          make_latest: true
      - name: Upload to CurseForge
        if: ${{ vars.CURSEFORGE_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric-mod/build/libs/buildblueprint-!(*-@(dev|sources|javadoc)).jar
          name: Build Blueprint ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          loaders: fabric
          game-versions: "26.3"
          java: 25
          dependencies: fabric-api(required)
          changelog-file: CHANGELOG.md
