          - { mc: "1.18.1",  id: forge-1.18.1, loader: forge, dir: ports/forge, run: 21, target: 17, type: beta, gv: "1.18.1" }
          - { mc: "1.17.1",  id: forge-1.17.1, loader: forge, dir: ports/forge, run: 21, target: 16, type: beta, gv: "1.17.1" }
          - { mc: "1.16.5",  id: forge-1.16.5, loader: forge, dir: ports/forge, run: 21, target: 8, type: beta, gv: "1.16.5" }
          - { mc: "1.16.4",  id: forge-1.16.4, loader: forge, dir: ports/forge, run: 21, target: 8, type: beta, gv: "1.16.4" }
          - { mc: "1.16.3",  id: forge-1.16.3, loader: forge, dir: ports/forge, run: 21, target: 8, type: beta, gv: "1.16.1 1.16.2 1.16.3", extra: "-Pmc_range=[1.16.1,1.16.3] -Pforge_major=32" }
          - { mc: "1.15.2",  id: forge-1.15.2, loader: forge, dir: ports/forge, run: 21, target: 8, type: beta, gv: "1.15.2" }
          - { mc: "1.21.8",  id: neoforge-1.21.8, loader: neoforge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.8" }
          - { mc: "1.21.5",  id: neoforge-1.21.5, loader: neoforge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.5" }
          - { mc: "1.21.4",  id: neoforge-1.21.4, loader: neoforge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.4" }
          - { mc: "1.21.3",  id: neoforge-1.21.3, loader: neoforge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.3" }
          - { mc: "1.20.6",  id: neoforge-1.20.6, loader: neoforge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.20.6" }
          - { mc: "1.20.4",  id: neoforge-1.20.4, loader: neoforge, dir: ports/forge, run: 21, target: 17, type: beta, gv: "1.20.4" }
          - { mc: "1.20.2",  id: neoforge-1.20.2, loader: neoforge, dir: ports/forge, run: 21, target: 17, type: beta, gv: "1.20.2" }
          - { mc: "1.20.3",  id: neoforge-1.20.3, loader: neoforge, dir: ports/forge, run: 21, target: 17, type: beta, gv: "1.20.3" }
          - { mc: "1.20.5",  id: neoforge-1.20.5, loader: neoforge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.20.5" }
          - { mc: "1.21.9",  dir: ports/1.21.11, run: 21, target: 21, type: beta, gv: "1.21.9" }
          - { mc: "1.21.8",  id: forge-1.21.8, loader: forge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.8" }
          - { mc: "1.21.10", id: forge-1.21.10, loader: forge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.10" }
          - { mc: "1.21.11", id: forge-1.21.11, loader: forge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.11" }
