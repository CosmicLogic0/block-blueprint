# Makes a new release when the version in package.json goes up (or when run by hand from the Actions tab):
#   1. builds the Windows installer for the app and puts it on the GitHub Releases page
#      (installed apps see it and update themselves)
#   2. builds the Minecraft mod, attaches the .jar to the same release and uploads it to CurseForge
name: Release

on:
  push:
    branches: [main, retry-mod]
  # Re-run some mod versions for the current release: list them in .github/retry.txt and push to branch "retry-mod".
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
      retry: ${{ steps.v.outputs.retry }}
      only: ${{ steps.v.outputs.only }}
      cf: ${{ steps.v.outputs.cf }}
      ready: ${{ steps.v.outputs.ready }}
      mr: ${{ steps.v.outputs.mr }}
      mronly: ${{ steps.v.outputs.mronly }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # CurseForge does not allow re-uploading unchanged files, so a version only goes to CurseForge when it is
          # listed in .github/curseforge-upload.txt AND that list was changed in this push (new or really changed versions).
          CF=""
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qx .github/curseforge-upload.txt; then CF=" $(grep -v '^#' .github/curseforge-upload.txt | tr '\n' ' ') "; fi
          echo "cf=$CF" >> "$GITHUB_OUTPUT"; echo "CurseForge uploads this time: [$CF]"
          # Modrinth-only re-upload: ids in .github/modrinth-retry.txt, when that file changes in this push (CurseForge is skipped)
          MRONLY=""
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qx .github/modrinth-retry.txt; then MRONLY=" $(grep -v '^#' .github/modrinth-retry.txt | tr '\n' ' ') "; fi
          echo "mronly=$MRONLY" >> "$GITHUB_OUTPUT"; echo "Modrinth-only uploads: [$MRONLY]"
          # versions that passed the player-style launch test (realtest.yml) on every game version they're listed for go up as Release, the rest as Beta
          READY=""; [ -f .github/release-ready.txt ] && READY=" $(grep -v '^#' .github/release-ready.txt | tr '\n' ' ') "
          echo "ready=$READY" >> "$GITHUB_OUTPUT"; echo "Release (not beta): [$READY]"
          # Modrinth: uploads the same files as CurseForge once the project id is written in .github/modrinth-id.txt
          MR=$(grep -v '^#' .github/modrinth-id.txt 2>/dev/null | tr -d ' \r\n'); echo "mr=$MR" >> "$GITHUB_OUTPUT"; echo "Modrinth project: [$MR]"
          if [ "$GITHUB_REF_NAME" = "retry-mod" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "only= $(tr '\n' ' ' < .github/retry.txt) " >> "$GITHUB_OUTPUT"; exit 0
          fi
          # on main, only build when package.json changed in this push and the release doesn't exist yet
          if ! git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qx package.json && [ "$GITHUB_EVENT_NAME" = push ]; then echo "new=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

  app:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build the installer
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish never 2>&1 | tee build.log
      - name: Check the installer has every file the app needs
        shell: bash
        run: |
          set -o pipefail
          npx --yes @electron/asar list dist/win-unpacked/resources/app.asar | tr '\\' '/' > asar.txt
          # every file the app page loads (its own scripts + three.js) must be inside the app
          missing=0
          for f in /renderer/app.js /renderer/vendor/OrbitControls.js /node_modules/three/build/three.module.js /node_modules/three/build/three.core.js /preload.js /main.js; do
            grep -qx "$f" asar.txt || { echo "::error title=Missing from installer::$f"; missing=1; }
          done
          for f in $(grep -ho "from '\./[^']*'" renderer/*.js | sed "s/from '\.\///;s/'//" | sort -u); do
            grep -qx "/renderer/$f" asar.txt || { echo "::error title=Missing from installer::renderer/$f"; missing=1; }
          done
          exit $missing
      - name: Show the build error
        if: failure()
        shell: bash
        run: |
          msg=$(tail -n 40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Installer build failed::$msg"
      - name: Release notes
        shell: bash
        run: |
          { echo "**Block Blueprint app for Windows:** download \`Block-Blueprint-Setup-${{ needs.check.outputs.version }}.exe\` below (installed apps update themselves)."
            echo ""
            echo "**Build Blueprint Minecraft mod (Fabric, Forge, NeoForge):** download it on CurseForge: https://www.curseforge.com/minecraft/mc-mods/build-blueprint"
            echo ""; cat CHANGELOG.md; } > release-notes.md
      - name: Put the installer on the release page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: Block Blueprint ${{ needs.check.outputs.version }}
          body_path: release-notes.md
          make_latest: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  # One build per Minecraft version. 26.3 is the main release; the others are marked Beta on CurseForge.
  mod:
    runs-on: ubuntu-latest
    needs: [check, app]
    # the mod is only built when something goes to CurseForge (mod files are not put on GitHub)
    if: always() && (needs.check.outputs.cf != '' || needs.check.outputs.mronly != '') && (needs.check.outputs.new == 'true' && needs.app.result == 'success' || needs.check.outputs.retry == 'true')
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { mc: "26.3",    dir: fabric-mod,    run: 25, target: 25, type: release, gv: "26.3" }
          - { mc: "26.2",    dir: fabric-mod,    run: 25, target: 25, type: beta,    gv: "26.2" }
          - { mc: "26.1",    dir: fabric-mod,    run: 25, target: 25, type: beta,    gv: "26.1 26.1.1 26.1.2" }
          - { mc: "1.21.11", dir: ports/1.21.11, run: 21, target: 21, type: beta,    gv: "1.21.11" }
          - { mc: "1.21.10", dir: ports/1.21.11, run: 21, target: 21, type: beta,    gv: "1.21.10" }
          - { mc: "1.21.8",  dir: ports/1.21,    run: 21, target: 21, type: beta,    gv: "1.21.6 1.21.7 1.21.8" }
          - { mc: "1.21.5",  dir: ports/1.21,    run: 21, target: 21, type: beta,    gv: "1.21.5" }
          - { mc: "1.21.4",  dir: ports/1.21,    run: 21, target: 21, type: beta,    gv: "1.21.4" }
          - { mc: "1.21.3",  dir: ports/1.21,    run: 21, target: 21, type: beta,    gv: "1.21.3" }
          - { mc: "1.21.2",  dir: ports/1.21,    run: 21, target: 21, type: beta,    gv: "1.21.2" }
          - { mc: "1.21.1",  dir: ports/1.21,    run: 21, target: 21, type: beta,    gv: "1.21 1.21.1" }
          - { mc: "1.20.6",  dir: ports/1.21,    run: 21, target: 21, type: beta,    gv: "1.20.5 1.20.6" }
          - { mc: "1.20.4",  dir: ports/1.21,    run: 21, target: 17, type: beta,    gv: "1.20.3 1.20.4" }
          - { mc: "1.20.2",  dir: ports/1.21,    run: 21, target: 17, type: beta,    gv: "1.20.2" }
          - { mc: "1.20.1",  dir: ports/1.21,    run: 21, target: 17, type: beta,    gv: "1.20 1.20.1" }
          - { mc: "1.19.4",  dir: ports/1.21,    run: 21, target: 17, type: beta,    gv: "1.19.4" }
