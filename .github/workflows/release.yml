          - { mc: "1.21.5",  id: forge-1.21.5, loader: forge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.5" }
          - { mc: "1.21.4",  id: forge-1.21.4, loader: forge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.4" }
          - { mc: "1.21.3",  id: forge-1.21.3, loader: forge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.3" }
          - { mc: "1.21.1",  id: forge-1.21.1, loader: forge, dir: ports/forge, run: 21, target: 21, type: beta, gv: "1.21.1" }
