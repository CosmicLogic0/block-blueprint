# Builds the app for Mac and Linux and opens it once, without making a release.
# Runs when branch "apptest" is pushed; a screenshot and the logs go to branch "apptest-results".
name: App test (Mac + Linux)

on:
  push:
    branches: [apptest]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, flag: --mac, name: mac }
          - { os: ubuntu-latest, flag: --linux, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          npx electron-builder ${{ matrix.flag }} --publish never 2>&1 | tee out/build.log
          ls -la dist | tee out/dist.txt
      - name: Mac - signature
        if: runner.os == 'macOS'
        run: |
          APP=$(find dist -maxdepth 2 -name "*.app" | head -1); echo "$APP" | tee out/app.txt
          codesign -dv "$APP" > out/sign.txt 2>&1 || true
          codesign --verify --deep --strict "$APP" >> out/sign.txt 2>&1 && echo VERIFY OK >> out/sign.txt || echo VERIFY FAILED >> out/sign.txt
          lipo -archs "$APP/Contents/MacOS/Block Blueprint" >> out/sign.txt 2>&1 || true
      - name: Open the app, first-time setup, editor
        shell: bash
        run: |
          npm i --no-save playwright@1.56.1 > /dev/null 2>&1
          if [ "$RUNNER_OS" = macOS ]; then EXE="$(find dist -maxdepth 2 -name '*.app' | head -1)/Contents/MacOS/Block Blueprint"; node tools/ci/app_smoke.js "$EXE" out > out/run.log 2>&1 || true
          else sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null; xvfb-run -a -s "-screen 0 1400x900x24" node tools/ci/app_smoke.js "$PWD/dist/linux-unpacked/block-blueprint" out > out/run.log 2>&1 || true; fi
          cat out/run.log | head -40
      - name: Save results
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/res && cp -r out /tmp/res/${{ matrix.name }} 2>/dev/null || mkdir -p /tmp/res/${{ matrix.name }}
          echo "${{ github.sha }}" > /tmp/res/${{ matrix.name }}/COMMIT
          git config user.name "app test"; git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            rm -rf /tmp/r && git clone -q --depth 1 --branch apptest-results "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" /tmp/r 2>/dev/null || { rm -rf /tmp/r; mkdir /tmp/r; cd /tmp/r; git init -q; git checkout -q -b apptest-results; git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"; cd - > /dev/null; }
            rm -rf /tmp/r/${{ matrix.name }} && cp -r /tmp/res/${{ matrix.name }} /tmp/r/
            cd /tmp/r && git add -A && git -c user.name="app test" -c user.email="actions@users.noreply.github.com" commit -qm "app test ${{ matrix.name }} ${{ github.sha }}" && git push -q origin apptest-results && break
            cd - > /dev/null; sleep $((RANDOM % 10 + 3))
          done
