# Test-builds the mod for every supported Minecraft version (branch "ports" or by hand). No release is made.
name: Build all Minecraft versions

on:
  push:
    branches: [ports]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { mc: "26.3", dir: fabric-mod, java: 25 }
          - { mc: "26.2", dir: fabric-mod, java: 25 }
          - { mc: "26.1", dir: fabric-mod, java: 25 }
          - { mc: "1.21.1", dir: ports/1.21, java: 21 }
          - { mc: "1.21.4", dir: ports/1.21, java: 21 }
          - { mc: "1.21.5", dir: ports/1.21, java: 21 }
          - { mc: "1.21.8", dir: ports/1.21, java: 21 }
          - { mc: "1.21.11", dir: ports/1.21.11, java: 21 }
          - { mc: "1.21.10", dir: ports/1.21.11, java: 21 }
          - { mc: "1.21.9",  dir: ports/1.21.11, java: 21 }
          - { mc: "1.21.3",  dir: ports/1.21, java: 21 }
          - { mc: "1.21.2",  dir: ports/1.21, java: 21 }
          - { mc: "1.20.2",  dir: ports/1.21, java: 17 }
          - { mc: "1.19.4",  dir: ports/1.21, java: 17 }
          - { mc: "1.19.3",  dir: ports/1.21, java: 17 }
          - { mc: "1.19.2",  dir: ports/1.21, java: 17 }
          - { mc: "1.18.2",  dir: ports/1.21, java: 17 }
          - { mc: "1.18.1",  dir: ports/1.21, java: 17, fapi: "1.18" }
          - { mc: "1.19.1",  dir: ports/1.21, java: 17 }
          - { mc: "1.19",    dir: ports/1.21, java: 17 }
          - { mc: "1.17.1",  dir: ports/1.21, java: 16, fapi: "1.17" }
          - { mc: "1.16.5",  dir: ports/1.21, java: 8, fapi: "1.16" }
          - { mc: "1.20.1",  id: "forge-1.20.1", dir: ports/forge, java: 17, loader: forge }
          - { mc: "1.21.1",  id: "neoforge-1.21.1", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.19.2",  id: "forge-1.19.2", dir: ports/forge, java: 17, loader: forge }
          - { mc: "1.18.2",  id: "forge-1.18.2", dir: ports/forge, java: 17, loader: forge }
          - { mc: "1.16.5",  id: "forge-1.16.5", dir: ports/forge, java: 8, loader: forge }
          - { mc: "1.21.11", id: "forge-1.21.11", dir: ports/forge, java: 21, loader: forge }
          - { mc: "1.21.10", id: "forge-1.21.10", dir: ports/forge, java: 21, loader: forge }
          - { mc: "1.21.8",  id: "forge-1.21.8", dir: ports/forge, java: 21, loader: forge }
          - { mc: "1.21.11", id: "neoforge-1.21.11", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.21.10", id: "neoforge-1.21.10", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.21.5",  id: "forge-1.21.5", dir: ports/forge, java: 21, loader: forge }
          - { mc: "1.21.4",  id: "forge-1.21.4", dir: ports/forge, java: 21, loader: forge }
          - { mc: "1.21.3",  id: "forge-1.21.3", dir: ports/forge, java: 21, loader: forge }
          - { mc: "1.21.1",  id: "forge-1.21.1", dir: ports/forge, java: 21, loader: forge }
          - { mc: "1.20.6",  id: "forge-1.20.6", dir: ports/forge, java: 21, loader: forge }
          - { mc: "1.20.4",  id: "forge-1.20.4", dir: ports/forge, java: 17, loader: forge }
          - { mc: "1.20.2",  id: "forge-1.20.2", dir: ports/forge, java: 17, loader: forge }
          - { mc: "1.19.4",  id: "forge-1.19.4", dir: ports/forge, java: 17, loader: forge }
          - { mc: "1.19.3",  id: "forge-1.19.3", dir: ports/forge, java: 17, loader: forge }
          - { mc: "1.19",  id: "forge-1.19", dir: ports/forge, java: 17, loader: forge }
          - { mc: "1.18.1",  id: "forge-1.18.1", dir: ports/forge, java: 17, loader: forge }
          - { mc: "1.17.1",  id: "forge-1.17.1", dir: ports/forge, java: 16, loader: forge }
          - { mc: "1.21.8",  id: "neoforge-1.21.8", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.21.5",  id: "neoforge-1.21.5", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.21.4",  id: "neoforge-1.21.4", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.21.3",  id: "neoforge-1.21.3", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.20.6",  id: "neoforge-1.20.6", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.20.4",  id: "neoforge-1.20.4", dir: ports/forge, java: 17, loader: neoforge }
          - { mc: "1.20.2",  id: "neoforge-1.20.2", dir: ports/forge, java: 17, loader: neoforge }
          - { mc: "26.3", id: "neoforge-26.3", dir: ports/neoforge-26, java: 25, loader: neoforge26 }
          - { mc: "26.2", id: "neoforge-26.2", dir: ports/neoforge-26, java: 25, loader: neoforge26 }
          - { mc: "26.1.2", id: "neoforge-26.1.2", dir: ports/neoforge-26, java: 25, loader: neoforge26 }
          - { mc: "26.1.1", id: "neoforge-26.1.1", dir: ports/neoforge-26, java: 25, loader: neoforge26 }
          - { mc: "26.1", id: "neoforge-26.1", dir: ports/neoforge-26, java: 25, loader: neoforge26 }
          - { mc: "26.3", id: "forge-26.3", dir: ports/forge-26, java: 25, loader: forge26 }
          - { mc: "26.2", id: "forge-26.2", dir: ports/forge-26, java: 25, loader: forge26 }
          - { mc: "26.1.2", id: "forge-26.1.2", dir: ports/forge-26, java: 25, loader: forge26 }
          - { mc: "26.1.1", id: "forge-26.1.1", dir: ports/forge-26, java: 25, loader: forge26 }
          - { mc: "26.1", id: "forge-26.1", dir: ports/forge-26, java: 25, loader: forge26 }
          - { mc: "1.21.9", id: "forge-1.21.9", dir: ports/forge, java: 21, loader: forge }
          - { mc: "1.21.7", id: "forge-1.21.7", dir: ports/forge, java: 21, loader: forge }
          - { mc: "1.21.6", id: "forge-1.21.6", dir: ports/forge, java: 21, loader: forge }
          - { mc: "1.21", id: "forge-1.21", dir: ports/forge, java: 21, loader: forge }
          - { mc: "1.20.3", id: "forge-1.20.3", dir: ports/forge, java: 17, loader: forge }
          - { mc: "1.20", id: "forge-1.20", dir: ports/forge, java: 17, loader: forge }
          - { mc: "1.19.1", id: "forge-1.19.1", dir: ports/forge, java: 17, loader: forge }
          - { mc: "1.18", id: "forge-1.18", dir: ports/forge, java: 17, loader: forge }
          - { mc: "1.21.9", id: "neoforge-1.21.9", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.21.7", id: "neoforge-1.21.7", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.21.6", id: "neoforge-1.21.6", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.21.2", id: "neoforge-1.21.2", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.21", id: "neoforge-1.21", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.20.5", id: "neoforge-1.20.5", dir: ports/forge, java: 21, loader: neoforge }
          - { mc: "1.20.6", dir: ports/1.21, java: 21 }
          - { mc: "1.20.4", dir: ports/1.21, java: 17 }
          - { mc: "1.20.1", dir: ports/1.21, java: 17 }
    name: ${{ matrix.id || matrix.mc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ matrix.java == 25 && 25 || 21 }}" }   # Loom needs 21+; older targets compile with --release
      - name: Find the Fabric API (or Forge) for this version
        id: fapi
        run: |
          if [ "${{ matrix.loader }}" = "forge" ]; then
            F=$(curl -s https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -o "<version>${{ matrix.mc }}-[^<]*</version>" | sed 's/<[^>]*>//g; s/^${{ matrix.mc }}-//' | tail -1)
            L=$(curl -s https://maven.architectury.dev/dev/architectury/loom/dev.architectury.loom.gradle.plugin/maven-metadata.xml | grep -o "<latest>[^<]*</latest>" | sed 's/<[^>]*>//g')
            echo "Forge: $F  Architectury Loom: $L"
            echo "args=-Pforge_version=$F -Parch_loom_version=$L" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ matrix.loader }}" = "forge26" ]; then
            F=$(curl -s https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -o "<version>${{ matrix.mc }}-[^<]*</version>" | sed 's/<[^>]*>//g; s/^${{ matrix.mc }}-//' | tail -1)
            echo "Forge: $F"
            echo "args=-Pforge_version=$F" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ matrix.loader }}" = "neoforge26" ]; then
            P="${{ matrix.mc }}"; case "$P" in *.*.*) ;; *) P="$P.0" ;; esac      # 26.3 -> 26.3.0, 26.1.2 stays
            F=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE "<version>$P\.[0-9]+(-beta)?</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1)
            echo "NeoForge: $F"
            echo "args=-Pneo_version=$F" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ matrix.loader }}" = "neoforge" ]; then
            P=$(echo "${{ matrix.mc }}" | sed 's/^1\.//'); case "$P" in *.*) ;; *) P="$P.0" ;; esac                      # 1.21.1 -> 21.1
            F=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE "<version>$P\.[0-9]+(-beta)?</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1)
            L=$(curl -s https://maven.architectury.dev/dev/architectury/loom/dev.architectury.loom.gradle.plugin/maven-metadata.xml | grep -o "<latest>[^<]*</latest>" | sed 's/<[^>]*>//g')
            echo "NeoForge: $F  Architectury Loom: $L"
            echo "args=-Ploom.platform=neoforge -Pforge_version=$F -Parch_loom_version=$L" >> "$GITHUB_OUTPUT"; exit 0
          fi
          V=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+${{ matrix.fapi || matrix.mc }}</version>" | sed 's/<[^>]*>//g' | tail -1)
          echo "Fabric API: $V"
          if [ -z "$V" ]; then echo "::error title=mc ${{ matrix.mc }}::No Fabric API found for this Minecraft version"; exit 1; fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build -x test --no-daemon -Pminecraft_version=${{ matrix.mc }} ${{ steps.fapi.outputs.args || format('-Pfabric_api_version={0}', steps.fapi.outputs.v) }} -Pjava_version=${{ matrix.java }} 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        working-directory: ${{ matrix.dir }}
        run: |
          [ -f build.log ] || exit 0
          # one line per distinct problem: file:line, the message and the missing symbol
          python3 - <<'PY' > errs.txt
          import re
          L=open('build.log',errors='replace').read().split('\n'); out=[]; seen=set()
          for i,l in enumerate(L):
              m=re.search(r'/(\S+?\.java):(\d+): error: (.*)',l)
              if not m: continue
              sym=''
              for k in range(i+1,min(i+6,len(L))):
                  if 'symbol:' in L[k]: sym=L[k].strip(); break
              code=L[i+1].strip() if i+1<len(L) else ''
              key=(m.group(1),m.group(3),sym)
              if key in seen: continue
              seen.add(key); out.append(f"{m.group(1).split('/')[-1]}:{m.group(2)} {m.group(3)} | {sym} | {code[:140]}")
          if not out:
              for i,l in enumerate(L):
                  if 'What went wrong' in l: out += [x for x in L[i:i+14] if x.strip()]
              out += [l for l in L if 'Could not' in l or 'error:' in l.lower()][:20]
          print('\n'.join(out[:150]))
          PY
          cp errs.txt errs.keep 2>/dev/null; E=$(sed 's/%/%25/g' errs.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=mc ${{ matrix.mc }} build failed::$E"
      - name: Write the result
        if: always()
        run: |
          mkdir -p result
          if [ -f ${{ matrix.dir }}/errs.txt ]; then cp ${{ matrix.dir }}/errs.txt result/${{ matrix.id || matrix.mc }}.txt; \
          elif ls ${{ matrix.dir }}/build/libs/*.jar >/dev/null 2>&1; then echo "OK $(ls ${{ matrix.dir }}/build/libs/)" > result/${{ matrix.id || matrix.mc }}.txt; \
            mkdir -p result/jars; for j in ${{ matrix.dir }}/build/libs/*.jar; do case "$j" in *-sources.jar) ;; *) cp "$j" result/jars/;; esac; done; \
          else tail -n 60 ${{ matrix.dir }}/build.log > result/${{ matrix.id || matrix.mc }}.txt 2>/dev/null || echo "FAILED before building" > result/${{ matrix.id || matrix.mc }}.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.id || matrix.mc }}
          path: result/

  # Puts every version's result in the "ci-results" branch so it can be read with plain git.
  collect:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: out
      - name: Push results
        run: |
          cd out
          git init -q -b ci-results
          git config user.name ci; git config user.email ci@example.com
          echo "${GITHUB_SHA}" > COMMIT
          git add -A; git commit -qm "results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
