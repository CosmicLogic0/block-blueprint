# The Bedrock add-on in the real Minecraft Bedrock server: the scripts load, every starter build is read, placed
# (straight and turned) and checked block by block (scriptevent bb:selftest). Also makes the .mcaddon file.
# Runs when branch "addontest" is pushed; log + .mcaddon go to branch "addontest-results".
name: Bedrock add-on test

on:
  push:
    branches: [addontest]

permissions:
  contents: write

jobs:
  bds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the add-on
        run: node tools/bedrock/build_addon.mjs
      - name: Bedrock server
        run: |
          url=$(curl -s -H "User-Agent: Mozilla/5.0" https://net-secondary.web.minecraft-services.net/api/v1.0/download/links | python3 -c "import json,sys; print([l['downloadUrl'] for l in json.load(sys.stdin)['result']['links'] if l['downloadType']=='serverBedrockLinux'][0])")
          echo "$url"; mkdir -p bds && cd bds && curl -sL -A "Mozilla/5.0" "$url" -o bds.zip && unzip -q bds.zip
      - name: Install the add-on in a world
        run: |
          cd bds
          cp -r "../bedrock-addon/BP" behavior_packs/build_blueprint; cp -r "../bedrock-addon/RP" resource_packs/build_blueprint
          sed -i 's/^level-type=.*/level-type=FLAT/; s/^gamemode=.*/gamemode=creative/; s/^allow-cheats=.*/allow-cheats=true/; s/^content-log-console-output-enabled=.*/content-log-console-output-enabled=true/' server.properties
          grep -q content-log-console-output-enabled server.properties || echo "content-log-console-output-enabled=true" >> server.properties
          mkdir -p "worlds/Bedrock level"
          python3 -c "import json; m=json.load(open('behavior_packs/build_blueprint/manifest.json')); print(json.dumps([{'pack_id':m['header']['uuid'],'version':m['header']['version']}]))" > "worlds/Bedrock level/world_behavior_packs.json"
          python3 -c "import json; m=json.load(open('resource_packs/build_blueprint/manifest.json')); print(json.dumps([{'pack_id':m['header']['uuid'],'version':m['header']['version']}]))" > "worlds/Bedrock level/world_resource_packs.json"
      - name: Run the self test
        run: |
          cd bds; mkdir -p ../res; mkfifo in
          (cat in | LD_LIBRARY_PATH=. ./bedrock_server > ../res/server.log 2>&1 &)
          exec 3>in
          for i in $(seq 1 60); do grep -q "Server started" ../res/server.log && break; sleep 2; done
          sleep 3; echo "tickingarea add 0 90 0 1999 160 40 bb" >&3; sleep 10
          echo "scriptevent bb:selftest" >&3
          for i in $(seq 1 90); do grep -q "BBTEST done" ../res/server.log && break; sleep 2; done
          sleep 2; echo stop >&3; sleep 5; exec 3>&-
          grep -iE "BBTEST|error|warn|script|pack stack|\[Scripting\]" ../res/server.log | grep -v "ALLOW LIST\|allow list\|allowlist" | head -80
      - name: Save
        if: always()
        run: |
          mkdir -p res; cp dist/Build-Blueprint-Bedrock.mcaddon res/ 2>/dev/null || true
          cd res && echo "${GITHUB_SHA}" > COMMIT
          git init -q -b addontest-results && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "addon test ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" addontest-results
