// Shared by the Fabric (ports/1.21) and Forge (ports/forge) builds: which helper group a Minecraft version uses,
// and the name swaps that make the shared screen/client code compile on older Minecraft versions.

ext.bbCompatFor = { String mcv ->
    mcv in ['1.20.5', '1.20.6'] ? '1.20.6' :
    mcv in ['1.20.2', '1.20.3', '1.20.4'] ? '1.20.4' :
    mcv.startsWith('1.20') ? '1.20.1' :
    mcv == '1.19.4' ? '1.19.4' : mcv == '1.19.3' ? '1.19.3' : mcv == '1.19' ? '1.19' : mcv.startsWith('1.19') ? '1.19.2' :
    mcv.startsWith('1.18') ? '1.18.2' : mcv.startsWith('1.17') ? '1.17.1' : mcv.startsWith('1.16') ? '1.16.5' : mcv.startsWith('1.15') ? '1.15.2' :
    mcv in ['1.21', '1.21.1'] ? '1.21.1' :
    mcv in ['1.21.2', '1.21.3', '1.21.4'] ? '1.21.4' :
    mcv == '1.21.5' ? '1.21.5' : mcv in ['1.21.9', '1.21.10'] ? '1.21.10' : mcv == '1.21.11' ? '1.21.11' : '1.21.8'
}

ext.bbFlags = { String compat -> [
    legacyGui: compat.startsWith('1.19') || compat.startsWith('1.18') || compat.startsWith('1.17') || compat.startsWith('1.16') || compat.startsWith('1.15'),  // no GuiGraphics yet
    noBuilder: compat in ['1.19', '1.19.2', '1.18.2', '1.17.1', '1.16.5', '1.15.2'],                                              // no Button.builder / Tooltip
    oldText:   compat in ['1.18.2', '1.17.1', '1.16.5', '1.15.2'],                                                                          // no Component.literal, commands v1
    java8:     compat in ['1.16.5', '1.15.2'],
    mc115:     compat in ['1.15.2'],                                                                                       // buttons / text boxes take plain text, no PoseStack in menus
    newTypes:  compat in ['1.21.11'],                                                                                             // RenderType moved to client.renderer.rendertype                                                                                              // Java 8: no records, no addRenderableWidget
] }

// Java 8: turn each one-line `record Name(A a, B b) {` into an ordinary class (Jabel handles var / switch -> / instanceof patterns)
ext.bbRecordToClass = { String l ->
    def m = (l =~ /^(\s*)((?:public |private |protected )?)(?:static )?record (\w+)\((.*?)\)\s*\{(.*)$/)
    if (!m.find()) return l
    String ind = m.group(1), vis = m.group(2), name = m.group(3), rest = m.group(5)
    def comps = m.group(4).split(',').collect { it.trim() }.findAll { it }
    def sb = new StringBuilder()
    sb << ind << vis << (ind.length() > 0 ? 'static ' : '') << "final class ${name} {"
    comps.each { sb << " public final ${it};" }
    sb << " public ${name}(" << comps.join(', ') << ") {"
    comps.each { c -> def n = c.split(/\s+/)[-1]; sb << " this.${n} = ${n};" }
    sb << " }"
    comps.each { c -> def ps = c.split(/\s+/); def n = ps[-1]; sb << " public ${ps[0..-2].join(' ')} ${n}() { return ${n}; }" }
    sb << ' ' << rest
    sb.toString()
}

ext.bbFilter = { String l, Map f ->
    if (f.legacyGui && l.trim() == 'import net.minecraft.client.gui.GuiGraphics;') return ''
    if (f.newTypes) l = l.replace('import net.minecraft.client.renderer.RenderType;', 'import net.minecraft.client.renderer.rendertype.RenderType;')
                         .replace('camera().getPosition()', 'camera().position()').replace('cam.getXRot()', 'cam.xRot()').replace('cam.getYRot()', 'cam.yRot()')
    if (f.noBuilder) {
        l = l.replace('Button.builder(', 'Btn.builder(').replace('net.minecraft.client.gui.components.Tooltip.create(', 'Btn.tip(')
             .replace('Tooltip.create(', 'Btn.tip(').replace('net.minecraft.client.gui.components.Tooltip', 'Btn.Tip')
             .replaceAll(/(\w+)\.setHint\(/, 'V.hint($1, ')
        if (l.trim() == 'import Btn.Tip;') return ''
    }
    if (f.java8) {
        l = bbRecordToClass(l).replace('addRenderableWidget(', 'addButton(').replaceAll(/\.getInventory\(\)/, '.inventory').replaceAll(/\.getYRot\(\)/, '.yRot')
    }
    if (f.mc115) {
        l = l.replaceAll(/(\w+)\.setMessage\(/, 'V.setMessage($1, ').replace('new EditBox(', 'V.editBox(')
        l = l.replace('.plainSubstrByWidth(', '.substrByWidth(').replace('mc.level.dimension()', 'V.dim(mc.level)')
             .replace('mc.getSingleplayerServer().getWorldData().getLevelName()', 'V.levelName(mc.getSingleplayerServer())')
             .replaceAll(/Vec3\.atCenterOf\(([\w.]+)\)/, 'new Vec3($1.getX() + 0.5, $1.getY() + 0.5, $1.getZ() + 0.5)')
    }
    if (f.oldText) {
        l = l.replace('Component.literal(', 'new net.minecraft.network.chat.TextComponent(').replace('client.command.v2.', 'client.command.v1.')
        if (l.contains('ClientCommandRegistrationCallback.EVENT.register')) return '        body.accept(ClientCommandManager.DISPATCHER);'
        if (l.contains('import net.fabricmc.fabric.api.client.command.v1.ClientCommandRegistrationCallback')) return ''
    }
    return l
}

// Swaps inside the version helpers (src/compat) for Minecraft versions that share a helper group but differ a little.
ext.bbCompatFilter = { String l, String mcv ->
    if (mcv in ['1.16', '1.16.1']) l = l.replace('screen.renderComponentTooltip(pose, ', 'screen.renderTooltip(pose, ')   // renamed in 1.16.2
    return l
}

// Forge / NeoForge builds: our stand-ins for Fabric's classes live in our own package, never under net.fabricmc.
// Some packs have mods that bring the real Fabric Loader classes along (Sinytra Connector, jar-in-jar libraries); two
// different classes with the same name crashed the game while loading ("IncompatibleClassChangeError ... FabricLoader").
ext.bbRelocate = { String l -> l.replace('net.fabricmc.', 'dev.buildblueprint.fabric.') }
