// Build Blueprint for Forge. Uses the same shared code as the Fabric ports (../1.21), plus small stand-ins
// (src/shim) for the few Fabric API classes that code uses, backed by Forge's own events.
plugins {
    id 'dev.architectury.loom' version "${arch_loom_version}"
}

def neo = project.findProperty('loom.platform') == 'neoforge'
def loaderName = neo ? 'neoforge' : 'forge'
version = "${project.mod_version}+${loaderName}-${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
    silentMojangMappingsLicense()
    // versions without a world render event get a tiny mixin instead (see src/<era>/res/buildblueprint.mixins.json)
    if (!neo && project.minecraft_version in ['1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11']) forge { mixinConfig 'buildblueprint.mixins.json' }
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    if (neo) neoForge "net.neoforged:neoforge:${project.forge_version}"
    else forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

def mcv = project.minecraft_version
apply from: '../shared.gradle'
def compat = project.findProperty('compat') ?: bbCompatFor(mcv)
def flags = bbFlags(compat)
def javaVer = (project.findProperty('java_version') ?: (neo && !(mcv in ['1.20.2', '1.20.3', '1.20.4']) ? '21' : flags.java8 ? '8' : '17')) as int
// Forge's events changed over time: newer stand-ins in src/<loader>/shim, older ones layered on top
def eras = neo ? (mcv in ['1.20.2', '1.20.3', '1.20.4'] ? ['neoforge-1.20'] : mcv in ['1.20.5', '1.20.6'] ? ['neoforge-1.20.6'] :
                  mcv in ['1.21.6', '1.21.7', '1.21.8'] ? ['neoforge-1.21.8'] : mcv in ['1.21.9', '1.21.10', '1.21.11'] ? ['neoforge-1.21.11'] : [])
         : mcv in ['1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11'] ? ['forge-1.21.8', 'forge-1.21.3', 'forge-1.21'] :
           mcv in ['1.21.3', '1.21.4', '1.21.5'] ? ['forge-1.21.3', 'forge-1.21'] :
           mcv in ['1.20.5', '1.20.6'] || mcv.startsWith('1.21') ? ['forge-1.21'] :
           mcv == '1.19' ? ['forge-1.19.0', 'forge-1.19'] : mcv.startsWith('1.19') ? ['forge-1.19'] :
           mcv == '1.18.2' ? ['forge-1.18'] : mcv.startsWith('1.18') ? ['forge-1.18.1', 'forge-1.18'] :
           mcv.startsWith('1.17') ? ['forge-1.17', 'forge-1.18'] : mcv.startsWith('1.16') ? ['forge-1.16'] : []
println "Build Blueprint (Forge): Minecraft ${mcv}, helpers from ../1.21/src/compat/${compat}"

def gen = layout.buildDirectory.dir('gen-src'), core = layout.buildDirectory.dir('core-src'), res = layout.buildDirectory.dir('shared-res')
tasks.register('bbCore', Sync) { from('../../fabric-mod/src/main/java') { include 'dev/buildblueprint/core/**' }; into core; filter { String l -> flags.java8 ? bbRecordToClass(l) : l } }
def shims = layout.buildDirectory.dir('shim-src')
tasks.register('bbShims', Sync) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE      // the first copy of a file wins: era overrides go first
    eras.each { from("src/${it}/shim") }
    from("src/${loaderName}/shim") { if (flags.oldText) exclude 'net/fabricmc/fabric/api/client/command/v2/**' }
    into shims
    inputs.property 'eras', eras.join(',')
    filter { String l -> bbFilter(l, flags) }
}
tasks.register('bbRes', Sync) { from('../../fabric-mod/src/main/resources') { include 'assets/**' }; into res }
tasks.register('bbMakeSources', Sync) {
    from '../1.21/src/main/java'
    from "../1.21/src/compat/${compat}/java"
    into gen
    inputs.property 'compat', compat
    filter { String l -> bbFilter(l, flags)
                          .replace('net.fabricmc.fabric.api.client.command.v2.FabricClientCommandSource', 'net.minecraft.commands.CommandSourceStack')
                          .replace('net.fabricmc.fabric.api.client.command.v1.FabricClientCommandSource', 'net.minecraft.commands.CommandSourceStack')
                          .replace('FabricClientCommandSource', 'CommandSourceStack') }
}
def entries = layout.buildDirectory.dir('entry-src'), eraRes = layout.buildDirectory.dir('era-res')
tasks.register('bbEntry', Sync) { duplicatesStrategy = DuplicatesStrategy.EXCLUDE; eras.each { from("src/${it}/entry") }; from("src/${loaderName}/entry"); into entries }
tasks.register('bbEraRes', Sync) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    eras.each { from("src/${it}/res") }
    // NeoForge before 1.20.5 reads META-INF/mods.toml, newer ones neoforge.mods.toml
    from("src/${loaderName}/res") { if (eras.contains('neoforge-1.20')) exclude 'META-INF/neoforge.mods.toml' }
    into eraRes
}
compileJava.dependsOn bbEntry
processResources.dependsOn bbEraRes
sourceSets.main.java.srcDirs = [gen, core, shims, entries]
sourceSets.main.resources.srcDirs = ['src/main/resources', eraRes, res]
compileJava.dependsOn bbMakeSources, bbCore, bbShims
processResources.dependsOn bbRes
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn bbMakeSources, bbCore, bbRes, bbShims, bbEntry, bbEraRes }

def mcRange = project.findProperty('mc_range') ?: (mcv == '1.20.1' ? '[1.20,1.20.1]' : mcv == '1.21.1' ? '[1.21,1.21.1]' : "[${mcv}]")
def forgeMajor = (project.forge_version.split('\\.')[0]) as int
processResources {
    inputs.property 'version', project.mod_version
    inputs.property 'mcRange', mcRange
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) { expand 'version': project.mod_version, 'mcRange': mcRange, 'forgeMajor': forgeMajor }
    def pack = ['1.16.5': 6, '1.17.1': 7, '1.18': 8, '1.18.1': 8, '1.18.2': 8, '1.19': 9, '1.19.2': 9, '1.19.3': 12, '1.19.4': 13, '1.20.1': 15, '1.20.2': 18, '1.20.4': 22, '1.20.6': 32, '1.21.1': 34, '1.21.3': 42, '1.21.4': 46, '1.21.5': 55, '1.21.8': 64, '1.21.10': 69, '1.21.11': 75][mcv] ?: 15
    inputs.property 'pack', pack
    filesMatching('pack.mcmeta') { expand 'pack': pack }
}
tasks.withType(JavaCompile).configureEach {
    options.release = javaVer; options.encoding = 'UTF-8'
    if (javaVer < 16) { sourceCompatibility = '17'; options.compilerArgs += ['-Xlint:-options'] }   // Jabel: modern syntax, Java 8 classes
}
if (flags.java8) dependencies { annotationProcessor 'com.pkware.jabel:jabel-javac-plugin:1.0.1-1'; compileOnly 'com.pkware.jabel:jabel-javac-plugin:1.0.1-1' }
tasks.named("test") { enabled = false }

// Launch tests: start the game on the Java that Minecraft version really uses (old Forge can't start on new Java)
if (project.findProperty('run_java')) tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(project.findProperty('run_java') as int) }
}
