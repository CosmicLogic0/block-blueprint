// Build Blueprint for the older Minecraft versions that still use obfuscated names (1.21.x and before).
// The pure-Java core (blueprint format, layers, rotation...) is shared with the main mod in ../../fabric-mod.
plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// shared core + shared assets (language file, icon) from the main mod
def shared = layout.buildDirectory.dir('shared-src')
def sharedRes = layout.buildDirectory.dir('shared-res')
tasks.register('copySharedRes', Sync) {
    from('../../fabric-mod/src/main/resources') { include 'assets/**' }
    into sharedRes
}
// version-specific helpers: src/compat/<group>, picked from the Minecraft version
def mcv = project.minecraft_version
apply from: '../shared.gradle'
def compat = project.findProperty('compat') ?: bbCompatFor(mcv)
println "Build Blueprint: Minecraft ${mcv}, helpers from src/compat/${compat}"
def compatSrc = layout.buildDirectory.dir('compat-src')
tasks.register('bbCompat', Sync) {
    from "src/compat/${compat}/java"
    into compatSrc
    inputs.property 'mcv', mcv
    filter { String l -> bbCompatFilter(l, mcv) }
}

def flags = bbFlags(compat)
// Minecraft 1.16.1 and older: their Fabric API has no world render event, so a small mixin of our own fires one
def oldFabric = mcv in ['1.16', '1.16.1', '1.15', '1.15.1', '1.15.2', '1.14.4']
def java8 = flags.java8
tasks.register('copyShared', Sync) {
    from('../../fabric-mod/src/main/java') { include 'dev/buildblueprint/core/**' }
    into shared
    filter { String l -> java8 ? bbRecordToClass(l) : l }
}
def genMain = layout.buildDirectory.dir('gen-main')
tasks.register('bbMakeSources', Sync) {
    from 'src/main/java'
    into genMain
    inputs.property 'compat', compat
    filter { String l -> def o = bbFilter(l, flags); oldFabric ? o.replace('net.fabricmc.fabric.api.client.rendering.v1.WorldRender', 'dev.buildblueprint.oldfabric.WorldRender') : o }
}
compileJava.dependsOn bbMakeSources, bbCompat
sourceSets.main.java.srcDirs = [genMain, compatSrc, shared] + (oldFabric ? ['src/oldfabric/java'] : [])
sourceSets.main.resources.srcDir(sharedRes)
if (oldFabric) sourceSets.main.resources.srcDir('src/oldfabric/res')
compileJava.dependsOn copyShared
processResources.dependsOn copySharedRes
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn copyShared, copySharedRes, bbMakeSources, bbCompat }

def javaVer = (project.findProperty('java_version') ?: (java8 ? '8' : '21')) as int
// which Minecraft versions each jar may load on (the ones that share its code)
def ranges = ['1.15.2': '>=1.15 <=1.15.2', '1.16.1': '1.16.1', '1.19.2': '1.19.2', '1.19.1': '1.19.1', '1.19': '1.19', '1.18.2': '1.18.2', '1.18.1': '>=1.18 <=1.18.1', '1.17.1': '>=1.17 <=1.17.1', '1.20.1': '>=1.20 <=1.20.1', '1.20.4': '>=1.20.3 <=1.20.4', '1.20.6': '>=1.20.5 <=1.20.6', '1.21.1': '>=1.21 <=1.21.1',
              '1.21.4': '1.21.4', '1.21.5': '1.21.5', '1.21.8': '>=1.21.6 <=1.21.8']
def mcdep = project.findProperty('mc_dep') ?: (ranges[mcv] ?: mcv)
// Fabric API's mod id was "fabric" until 1.19.2 (newer builds for those versions still "provide" it), "fabric-api" after.
// Depending on "fabric-api" on the old versions made the game refuse to start with older Fabric API jars.
def mcParts = mcv.tokenize('.').collect { it as int } + [0, 0]
def fapi = (mcParts[1] < 19 || (mcParts[1] == 19 && mcParts[2] <= 2)) ? 'fabric' : 'fabric-api'
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcdep', mcdep
    inputs.property 'java', javaVer
    inputs.property 'fapi', fapi
    inputs.property 'oldFabric', oldFabric
    filesMatching('fabric.mod.json') { expand 'version': project.mod_version, 'mcdep': mcdep, 'java': javaVer, 'fapi': fapi, 'mixins': oldFabric ? '"buildblueprint.mixins.json"' : '' }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaVer
    if (javaVer < 16) { sourceCompatibility = '17'; options.compilerArgs += ['-Xlint:-options'] }   // Jabel: modern syntax, Java 8 classes
}
if (java8) dependencies { annotationProcessor 'com.pkware.jabel:jabel-javac-plugin:1.0.1-1'; compileOnly 'com.pkware.jabel:jabel-javac-plugin:1.0.1-1' }
java { toolchain { } }
tasks.named("test") { enabled = false }

// Launch tests: start the game on the Java that Minecraft version really uses (old Forge can't start on new Java)
if (project.findProperty('run_java')) tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(project.findProperty('run_java') as int) }
}

// The Minecraft version this file is built for, read by the mod (SchemCodec) to label exported .schem files.
def bbMcDir = layout.buildDirectory.dir('bb-mc')
tasks.register('bbMcVersion') {
    def v = project.minecraft_version.toString(); def out = bbMcDir
    inputs.property 'mc', v
    outputs.dir out
    doLast { def f = out.get().file('dev/buildblueprint/core/mc.txt').asFile; f.parentFile.mkdirs(); f.text = v }
}
sourceSets.main.resources.srcDir(bbMcDir)
processResources.dependsOn 'bbMcVersion'
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'bbMcVersion' }
