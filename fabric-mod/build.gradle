plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft 26.1+ is unobfuscated: no mappings line, plain implementation (no modImplementation).
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

sourceSets {
    main {
        java {
            if (project.findProperty('enableMenu') == 'true') srcDir 'src/menu/java'
            if (project.findProperty('enablePreview') == 'true') srcDir 'src/preview/java'
            if (project.findProperty('enableKeys') == 'true') srcDir 'src/keys/java'
            // version-specific bits: src/compat/<group>/java (the newest group that is not newer than this Minecraft)
            srcDir "src/compat/${project.findProperty('compat') ?: project.minecraft_version}/java"
        }
    }
}

def mcdep = project.findProperty('mc_dep') ?: "~${project.minecraft_version}"
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcdep', mcdep
    filesMatching('fabric.mod.json') { expand 'version': project.version, 'mcdep': mcdep, 'java': 25 }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// jar name includes the Minecraft version, e.g. buildblueprint-1.1.4+26.2.jar
version = "${project.mod_version}+${project.minecraft_version}"

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}

tasks.named("test") { enabled = false }

// The Minecraft version this file is built for, read by the mod (SchemCodec) to label exported .schem files.
def bbMcDir = layout.buildDirectory.dir('bb-mc')
tasks.register('bbMcVersion') {
    def v = project.minecraft_version.toString(); def out = bbMcDir
    inputs.property 'mc', v
    outputs.dir out
    doLast { def f = out.get().file('dev/buildblueprint/core/mc.txt').asFile; f.parentFile.mkdirs(); f.text = v }
}
sourceSets.main.resources.srcDir(bbMcDir)
processResources.dependsOn 'bbMcVersion'
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'bbMcVersion' }
