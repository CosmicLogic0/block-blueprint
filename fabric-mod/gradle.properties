org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---- Minecraft / Fabric versions ----
minecraft_version=26.3
# Loader and API match the CurseForge instance "My mod" (Fabric Loader 0.19.5, Fabric API 0.164.0+26.3).
loader_version=0.19.5
fabric_api_version=0.164.0+26.3
# Loom is the build tool plugin. 1.17 is what Fabric documents for 26.2; build-mod.bat tries newer ones if it is not found.
loom_version=1.17-SNAPSHOT

# ---- Optional parts. If the build fails inside one of them, set it to false and rebuild. ----
enableMenu=true
enablePreview=true
enableKeys=true

# ---- Mod ----
mod_version=1.0.0
maven_group=dev.buildblueprint
archives_base_name=buildblueprint
